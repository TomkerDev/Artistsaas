# Contraintes de la machine de développement : 7 Go de RAM au total.
#
# La valeur par défaut du template Flutter (-Xmx8G -XX:MaxMetaspaceSize=4G)
# demande plus de mémoire que la machine n'en possède : le daemon Gradle plante
# en pleine compilation et produit un fichier android/hs_err_pid*.log contenant
# « insufficient memory for the Java Runtime Environment to continue ».
# Ces valeurs sont calibrées pour cette configuration ; elles peuvent être
# augmentées sur une machine mieux dotée.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m

# La compilation Kotlin/Java de l'application utilise son propre processus JVM.
kotlin.daemon.jvmargs=-Xmx512m

android.useAndroidX=true

