# Configuration de génération des icônes de lancement Android.
#
# Le visuel officiel est la photo de l'artiste Jethsonat, recadrée sur la tête
# par `tool/generate_jethsonat_icon.ps1` :
#
#   powershell -ExecutionPolicy Bypass -File tool/generate_jethsonat_icon.ps1
#   dart run flutter_launcher_icons
#
# La seconde commande écrit `ic_launcher` (`mipmap-*`), `ic_launcher_foreground`
# (`drawable-*`) et l'icône adaptative (`mipmap-anydpi-v26/ic_launcher.xml`)
# dans `android/app/src/main/res/`.
#
# Note : `flutter_launcher_icons` 0.14.x **ne prend pas en charge** de bloc
# `flavors:`. Les flavors définis dans `android/app/build.gradle.kts`
# (`artist1`…`artist10`, `dilson_le_mustang`, `jethsonat`) partagent donc ces
# ressources. Un artiste qui doit afficher sa propre icône dépose ses fichiers
# dans `android/app/src/<flavor>/res/`, qui a priorité sur `main`.

flutter_launcher_icons:
  android: true
  ios: false
  min_sdk_android: 24

  # Photo officielle de Jethsonat, cadrée sur le portrait (fond noir).
  # Produite par `tool/generate_jethsonat_icon.ps1` — ne pas la régénérer avec
  # `tool/generate_brand_assets.dart`, qui produit la marque générique.
  image_path: assets/icons/jethsonat_icon.png

  # Icône adaptative (Android 8+) : le portrait est inséré dans la zone sûre
  # centrale (inset 16 % appliqué par `flutter_launcher_icons`), le fond noir
  # se prolonge sous les masques circulaires des constructeurs.
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/icons/jethsonat_icon.png
