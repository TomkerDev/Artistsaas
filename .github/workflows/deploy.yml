name: "CI / CD — Admin Web (Firebase Hosting)"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: ${{ runner.os }}-flutter-stable-${{ hashFiles('pubspec.yaml') }}

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter=expanded

  build-and-deploy:
    name: Build & Deploy
    needs: analyze-and-test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: novaa-music-tchaddd
      FIREBASE_AUTH_DOMAIN: novaa-music-tchaddd.firebaseapp.com
      FIREBASE_STORAGE_BUCKET: novaa-music-tchaddd.firebasestorage.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: ${{ runner.os }}-build-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

      - name: Pub get
        run: flutter pub get

      # Un secret de dépôt absent produirait un `--dart-define=FIREBASE_API_KEY=`
      # vide : le build aboutirait quand même, mais le panneau serait déployé
      # avec une configuration vide — et `force: true` écraserait la version en
      # ligne. On échoue donc avant de compiler quoi que ce soit.
      #
      # `FIREBASE_PROJECT_ID`, `FIREBASE_AUTH_DOMAIN` et
      # `FIREBASE_STORAGE_BUCKET` ne sont pas vérifiés : leur valeur est dans le
      # bloc `env:` du job, pas dans un secret.
      - name: Vérifier les secrets de build
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          missing=""
          for name in FIREBASE_API_KEY FIREBASE_APP_ID FIREBASE_MESSAGING_SENDER_ID SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets de dépôt manquants :$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "Les cinq secrets de build sont renseignés."

      - name: Build web (admin panel)
        run: |
          flutter build web \
            --target=lib/main_admin.dart \
            --release \
            --no-tree-shake-icons \
            --source-maps \
            --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} \
            --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ env.FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_AUTH_DOMAIN=${{ env.FIREBASE_AUTH_DOMAIN }} \
            --dart-define=FIREBASE_STORAGE_BUCKET=${{ env.FIREBASE_STORAGE_BUCKET }} \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Verify build output
        run: |
          if [ ! -f build/web/main.dart.js ]; then
            echo "::error::main.dart.js introuvable dans build/web/"
            exit 1
          fi
          echo "main.dart.js size:"
          du -h build/web/main.dart.js

      # Déploiement sur le canal `live` du site Hosting du projet.
      #
      # L'action officielle `FirebaseExtended/action-hosting-deploy` remplace
      # l'ancien `FirebaseExtended/action-setup-firebase` (qui n'existe pas et
      # faisait échouer le job sur un 404 au moment de la résolution de
      # l'action).
      #
      # Prérequis : un secret de dépôt `FIREBASE_SERVICE_ACCOUNT` contenant la
      # clé JSON d'un compte de service autorisé sur le projet Hosting.
      # `firebase init hosting:github` le crée et le renseigne automatiquement :
      #   https://github.com/TomkerDev/Artistsaas/settings/secrets/actions
      - name: Deploy to Firebase Hosting (canal live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          channelId: live
          force: true

      - name: Deployment info
        run: |
          echo "Deploiement termine -> https://${{ env.FIREBASE_PROJECT_ID }}.web.app"
          echo "Deploiement termine -> https://${{ env.FIREBASE_PROJECT_ID }}.firebaseapp.com"
